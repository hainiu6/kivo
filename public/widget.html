<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线客服</title><link rel="stylesheet" href="/chat-ui.css"><link rel="stylesheet" href="/widget.css"></head>
<body>
<header><div class="support-card"><img id="support-avatar" src="/support-avatar.svg" alt="客服头像"><div><h1 id="site-name">在线客服</h1><p id="agent-status">正在连接…</p></div></div><button id="close" type="button" aria-label="关闭客服窗口">×</button></header>
<main id="messages" aria-live="polite"><div class="welcome"><span>✦</span><h2>很高兴与你见面</h2><p id="greeting">正在连接客服…</p></div><div id="message-items"></div></main>
<div id="error" role="alert" hidden></div>
<form id="message-form"><div class="compose-card"><div id="attachment-preview" class="attachment-preview" hidden></div><label class="sr-only" for="message-input">消息内容</label><textarea id="message-input" placeholder="输入消息，也可以粘贴或拖入图片…" maxlength="4000" rows="2" disabled></textarea><div class="form-bottom"><div id="chat-tools" class="chat-tools"></div><button id="send" type="submit" disabled aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-7 18-3-7-8-3Zm8 3 10-11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button></div></div><div class="keyboard-help">Enter 发送 · Shift + Enter 换行</div></form>
<script src="/message-id.js" defer></script><script src="/stickers.js" defer></script><script src="/chat-ui.js" defer></script><script src="/socket.io/socket.io.js" defer></script><script src="/widget-frame.js" defer></script>
</body></html>
