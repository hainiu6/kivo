name: kivo
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TRUST_PROXY: '1'
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    ports:
      - '${HTTP_PORT:-8088}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
networks:
  backend:
volumes:
  caddy_data:
  caddy_config:
