name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.8.0); must be new'
        required: true
        default: v1.8.0
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '新消息提示音改为简洁的一声叮；放大左下角声音、接待状态与账号图标。' '新增客服在线／离线开关，所有后台实时同步，刷新和重启保留。主动离线后访客看到离线状态，并使用已配置的离线自动回复；后台仍能接收和回复消息。所有工作台断开时自动对外离线。' '会话卡片改为两行：第一行名称、在线／离线文字及时间，第二行消息摘要、网站及未读数。卡片高度 54px，绿色在线、灰色离线。收件箱显示全部网站的当前在线访客数，按会话去重，不受搜索、状态、网站筛选及列表上限影响。' '通过 38 项测试，覆盖接待状态权限、多个后台同步、实时在线人数、多标签去重、离线自动回复、删除、退出、重启保留及单声提示音。浏览器实测开关、刷新、两行布局与图标显示。详见 docs/support-presence.md。' '执行 bash /opt/kivo/scripts/upgrade.sh 后强制刷新后台。保留聊天记录、图片、网站、30 天登录和 PHP 用户配置。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
