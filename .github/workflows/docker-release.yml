name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.11.1); must be new'
        required: true
        default: v1.11.1
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '持续离线满 10 分钟只自动结束没有待人工回复消息的会话；后台已查看和自动回复均不算人工回复。升级恢复旧规则自动结束但尚未回复的会话，保留人工结束状态。' '新增 5 种更响亮的提示音：清亮单叮、醒目双叮、欢快三音、急促呼叫、经典叮咚。在账号设置中选择、试听并自动保存；静音偏好保留。' '通过 61 项测试，覆盖未回复保留、人工回复后结束、升级恢复、声音选择与静音、音频波形与 WAV 一致、响度和防削波；双架构 Debian 10 测试验证安装、备份、升级、回滚及已读数据保留。' '执行 bash /opt/kivo/scripts/upgrade.sh 后刷新后台，详见 docs/conversation-behavior.md 和 docs/message-notifications.md。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
