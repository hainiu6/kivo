name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.6.0); must be new'
        required: true
        default: v1.6.0
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '后台提示音改为更响亮的四音提醒，保留启用、试听、静音和消息去重。浏览器首次使用需要点击或按键后启用声音。' '管理员登录保持 30 天，成功恢复工作台时续期；仍有效的旧登录自动续期，退出及修改密码仍撤销登录。刷新恢复当前模块、会话、筛选、搜索和文字草稿，暂时网络失败显示重试入口。' '后台圆角输入框包住图片、表情和发送按钮；访客收到新的客服回复时自动展开窗口，不抢走网站输入框焦点，历史加载和重复消息不触发展开。' '新增奶猫、水豚、机器人三套共 18 个动态表情，加上原有团团共 26 个，两端支持套装切换、预览和发送，跳跃、旋转、爱心和纸屑动画更明显。' '升级保留会话、图片、网站和 PHP 用户配置。执行 bash /opt/kivo/scripts/upgrade.sh 后强制刷新后台和接入网站，现有嵌入代码继续使用。详见 docs/workspace-update.md。' '通过 30 天会话及旧登录续期、刷新恢复与网络重试、自动展开和焦点保护、全部表情两端发送等 32 项测试；浏览器实测刷新与表情发送；通过原生 amd64 / arm64 容器及 Debian 10 用户空间安装、升级和数据保留检查（CI 主机内核）。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
