name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.8.2); must be new'
        required: true
        default: v1.8.2
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '右下角客服按钮换为耳麦笑脸 SVG 图标；桌面图标从 26px 加大到 38px，窄屏使用 34px。支持主题色及原有呼吸、悬停和开关动效。' '优化会话收件箱右侧访客信息：顶部突出域名，路径精简显示且悬停可看完整地址；头像、名称、身份及在线状态紧凑排列；IP、地区突出显示。账号、设备和会话信息采用标签与值并排布局，自动隐藏无内容的用户 ID、账号及昵称。桌面资料栏略加宽，窄屏抽屉保持可用。' '通过 38 项测试及双架构容器、Debian 10 用户空间安装升级检查。浏览器核对新图标大小、按钮开关、匿名资料隐藏和资料栏布局。详见 docs/visitor-inspector.md。' '执行 bash /opt/kivo/scripts/upgrade.sh 后，强制刷新后台与接入客服的网站页面，加载新样式和 widget.js。保留聊天记录、图片、网站、30 天登录和 PHP 用户配置。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
