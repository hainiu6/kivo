name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.9.2); must be new'
        required: true
        default: v1.9.2
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '地区识别更新为 DB-IP 2026 年 10 月本地国家库，修复 179.255.146.39、179.255.158.39 被旧库误识别为巴西的问题；现在显示美国，不再附带错误的巴西城市。' '客服与访问统计的历史地区显示按当前库更新，无需清空记录，PV、UV 和消息保留。查询在本地完成，支持自定义 Country / City MMDB。' '通过 47 项测试，验证历史记录显示修正、自定义库回退及 IPv4 / IPv6；双架构镜像与 Debian 10 安装升级测试验证地区库及数据保留。' '执行 bash /opt/kivo/scripts/upgrade.sh 后强制刷新后台。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
