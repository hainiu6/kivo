name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.7.0); must be new'
        required: true
        default: v1.7.0
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '修正回复框的聚焦描边：圆角边框完整包住文字、图片、表情及发送按钮，去掉输入区域的重复描边。点击会话立即聚焦回复框，重连和其他页面加载历史不抢走焦点。' '右侧 IP 和地区移到访问域名下方，以加大、加粗的深色文字和醒目卡片展示。' '新增数据统计页：今天、最近 7 / 30 / 90 天及网站筛选；展示新增会话、咨询会话、访客消息、客服回复、在线访客、未读消息、每日趋势、消息类型、网站分布和每日明细。筛选及当前页面在刷新后恢复。' '历史数据按北京时间 UTC+8 汇总全部保留记录，不受最近 200 条列表限制。在线人数按会话去重，当前状态不受时间范围影响；删除记录后统计更新。页面可见时每 30 秒及新消息事件后自动更新。详见 docs/statistics.md。' '执行 bash /opt/kivo/scripts/upgrade.sh 后强制刷新后台。升级保留会话、图片、网站、30 天登录和 PHP 用户配置。' '通过 36 项测试，包括统计权限、跨网站及超过 200 条记录、零点边界、筛选、消息类型、在线去重、删除同步、异步响应竞争及点击聚焦；浏览器实测筛选刷新恢复和消息实时更新；通过原生 amd64 / arm64 容器及 Debian 10 用户空间安装升级、数据保留检查（CI 主机内核）。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
