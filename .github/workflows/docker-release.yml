name: Docker release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.5.0); must be new'
        required: true
        default: v1.5.0
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run check && npm test && npm audit --omit=dev
      - run: for file in examples/php/*.php examples/laravel54/config/*.php examples/laravel54/app/Http/Controllers/*.php examples/laravel54/routes/*.php; do php -l "$file"; done
      - run: bash test/runtime-detection.sh
      - name: Build image and test Debian 10 deployment
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$VERSION" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          IMAGE="kivo/app:${VERSION#v}-${GITHUB_SHA:0:7}-$ARCH"
          docker build -t "$IMAGE" .
          sudo bash test/docker-deploy.sh "$IMAGE" "$ARCH" "$GITHUB_SHA"
          sudo bash test/docker-runtime.sh "$IMAGE"
          bash scripts/package-release.sh "$VERSION" "$ARCH" "$IMAGE" "$GITHUB_SHA" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kivo-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified bundles
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          printf '%s\n' "$VERSION" > version.txt
          printf '%s\n\n' 'Docker 镜像版：Debian 10 / 11 / 12 / 13，amd64 / arm64，默认端口 8088。' '新增单条消息删除、当前会话清空、整段会话删除，以及全部 / 7 天前 / 一个月前（30 天）批量删除。批量操作可限定网站，按最近消息时间筛选，预览数量后确认；覆盖列表外的记录，保护预览后新建或重新活跃的会话。' '删除实时同步到访客与其他客服，相关图片一并清理；完整会话删除后访客可开始新对话。加载响应和延迟发送确认不会恢复已删除消息。保留网站配置、客服头像及其他会话的记录。' '访问域名移到右侧顶部，大号黑色显示。真实 IP 支持可信代理的 X-Forwarded-For / X-Real-IP，首次访问及重连时更新；宝塔部署需要 TRUST_PROXY=1、BIND_HOST=127.0.0.1 和正确转发头，详见 docs/history-management.md。' '升级保留现有数据、Session 用户名称及 PHP 签名对接配置。升级后强制刷新后台和网站。两个架构均通过删除权限、实时同步、图片清理、保留范围、并发响应、可信 IP 与原有聊天测试，以及实际容器删除和 Debian 10 用户空间安装、升级、端口冲突、数据保留及失败回退测试（CI 主机内核）。' > release-notes.md
          gh release create "$VERSION" kivo-linux-*.tar.gz SHA256SUMS version.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kivo $VERSION · Docker 镜像安装版" --notes-file release-notes.md
